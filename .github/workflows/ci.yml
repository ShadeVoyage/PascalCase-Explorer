name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Luau quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Smoke test
        run: lune run tests/smoke.luau

      - name: TreeStore tests
        run: lune run tests/tree_store.luau
